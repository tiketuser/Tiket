# tiket-agent configuration
# Copy to tiket-agent.conf next to the binary (or pass --config <path>).
# Every key can also come from the environment — see README.md.

# TIKET's relay. The agent only ever dials OUT to this host (HTTPS, port 443);
# you open no inbound ports and need no public URL or TLS certificate.
relay_url = https://tiket.co.il

# The shared secret TIKET generated for you (admin panel → provider → keys).
# Verification requests are HMAC-signed with it; the agent rejects anything else.
secret = PASTE-THE-SHARED-SECRET-HERE

# During key rotation, configure both keys by id (TIKET tells you the ids):
# secret.k_ab12cd34 = old-secret
# secret.k_ef56gh78 = new-secret

# Where the enrollment identity is stored (created by `tiket-agent enroll`).
credentials_file = tiket-agent-credentials.json

# ── How the agent reads YOUR ticket data (never leaves your network) ─────────
lookup_mode = http

# Your internal lookup endpoint (~20 lines of code in any language — see
# examples/lookup-endpoint/). Must be reachable only inside your network.
#   GET {lookup_url}?barcode=… → 200 ticket JSON | 404
lookup_url = http://localhost:8080/tiket/lookup

# Optional: enable ownership transfer (invalidate old barcode, issue to buyer).
#   POST {transfer_url} {"transfer":…,"record":…} → {"ok":true,"new_barcode":…}
# Leave commented out to answer transfers with "not_supported".
# transfer_url = http://localhost:8080/tiket/transfer

# ── OR: zero-code SQL mode (no endpoint to write at all) ─────────────────────
# Use a READ-ONLY database user. Alias columns to the protocol field names.
# Placeholder: $1 (postgres) / ? (mysql) / @p1 (sqlserver).
#
# lookup_mode = sql
# sql_driver  = postgres
# sql_dsn     = postgres://tiket_readonly:PASSWORD@localhost:5432/tickets
# sql_query   = SELECT barcode, event_name, venue_name AS venue, event_date AS date, event_time AS time, section, row_num AS row, seat_num AS seat, status, face_value AS original_price, id AS ticket_ref FROM tickets WHERE barcode = $1

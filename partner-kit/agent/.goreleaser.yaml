# goreleaser config for the Tiket Connect Agent.
#   goreleaser release --clean          (tagged release)
#   goreleaser release --snapshot --clean   (local dry run)
# Artifacts ship with SHA256SUMS; partners verify before deploying
# (see ../SECURITY.md §6). Sign the checksum file with minisign/cosign
# when release keys are set up.
version: 2

project_name: tiket-agent

builds:
  - main: ./cmd/tiket-agent
    binary: tiket-agent
    env: [CGO_ENABLED=0]
    ldflags: [-s -w]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - config.example.conf
      - src: ../spec/test-vectors.json
        dst: spec/test-vectors.json

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  draft: true

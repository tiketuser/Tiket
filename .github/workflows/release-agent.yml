name: Release Tiket Connect Agent

# Publishes the partner-facing agent binaries. Triggered by pushing a tag like
# `agent-v1.0.0` (prefixed so it never collides with an app deploy on `main`).
# The web app deploys are separate (deploy.yml / deploy-staging.yml).
#
# Artifacts land on the GitHub Release with STABLE, version-less names, so the
# partner docs can link one permanent URL:
#   https://github.com/tiketuser/Tiket/releases/latest/download/tiket-agent_linux_amd64.tar.gz
#   https://github.com/tiketuser/Tiket/releases/latest/download/SHA256SUMS

on:
  push:
    tags: ['agent-v*']
  workflow_dispatch: {}   # dry run: builds + selftests, does not publish

permissions:
  contents: write         # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: partner-kit/agent/go.sum

      # Gate the release on the agent passing its own shared protocol vectors —
      # never ship a binary that disagrees with spec/test-vectors.json.
      - name: Vet, test, selftest
        working-directory: partner-kit/agent
        run: |
          go vet ./...
          go test ./...
          make selftest

      # Cross-compile the matrix + SHA256SUMS into partner-kit/agent/dist/.
      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          workdir: partner-kit/agent
          args: release --snapshot --clean

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            partner-kit/agent/dist/tiket-agent_*.tar.gz
            partner-kit/agent/dist/tiket-agent_*.zip
            partner-kit/agent/dist/SHA256SUMS

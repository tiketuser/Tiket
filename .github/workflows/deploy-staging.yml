name: Deploy to Staging

# Thin caller: every push to `staging` deploys web + pushes an OTA update to the
# staging channel; Android store build runs only when native paths change or the
# commit message asks for it. Manual multi-target control lives in publish.yml
# (Actions → "Publish (web / OTA / stores)" → Run workflow).

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      channel: staging
    secrets: inherit

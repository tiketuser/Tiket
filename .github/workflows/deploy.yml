name: Deploy to Production

# Thin caller: every push to `main` deploys web + pushes an OTA update to the
# production channel; Android store build runs only when native paths change or
# the commit message asks for it (App Store / Play releases stay manual).
# Manual multi-target control lives in publish.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      channel: production
    secrets: inherit
